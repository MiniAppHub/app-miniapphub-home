<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Маркет · MiniAppHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button id="home" class="back" type="button">← Рабочий стол</button>
  <span class="brand">Маркет</span>
  <span></span>
</header>

<main class="view">
  <input id="q" class="search" type="search" placeholder="Поиск по названию и описанию" aria-label="Поиск">
  <div id="list" class="list"></div>
  <p id="msg" class="muted" hidden></p>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <h2 id="sheet-title"></h2>
    <p id="sheet-desc" class="muted"></p>
    <p id="sheet-perm" class="muted small"></p>
    <div class="sheet-actions">
      <button id="sheet-close" class="btn ghost" type="button">Закрыть</button>
      <button id="sheet-primary" class="btn" type="button"></button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script type="module" src="market.js"></script>
</body>
</html>
