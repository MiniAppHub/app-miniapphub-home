<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>MiniAppHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button class="brand" data-view="home">MiniAppHub</button>
  <span id="env" class="env"></span>
</header>

<div class="tabs" role="tablist">
  <button class="tab on" data-view="home" role="tab">Рабочий стол</button>
  <button class="tab" data-view="catalog" role="tab">Каталог</button>
  <button class="tab" data-view="settings" role="tab">Настройки</button>
</div>

<main id="home" class="view">
  <div id="grid" class="grid"></div>
  <p id="empty" class="muted" hidden>Пока нет приложений. Откройте «Каталог» и установите первое.</p>
</main>

<main id="catalog" class="view" hidden>
  <input id="q" class="search" type="search" placeholder="Поиск по названию и описанию" aria-label="Поиск">
  <div id="list" class="list"></div>
  <p id="catalog-msg" class="muted" hidden></p>
</main>

<main id="settings" class="view" hidden>
  <form id="form" class="form">
    <label>Адрес каталога
      <input name="catalogUrl" type="url" required autocomplete="off">
    </label>
    <label>Тема
      <select name="theme"><option value="dark">тёмная</option><option value="light">светлая</option></select>
    </label>
    <button class="btn" type="submit">Сохранить</button>
    <p id="form-msg" class="muted" hidden></p>
  </form>
  <section class="about">
    <p>Оболочка <span id="shell-ver">—</span> · платформа <span id="shell-platform">—</span></p>
    <button id="reload" class="btn ghost" type="button">Обновить список</button>
  </section>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <h2 id="sheet-title"></h2>
    <p id="sheet-desc" class="muted"></p>
    <p id="sheet-perm" class="perm"></p>
    <div class="sheet-actions">
      <button id="sheet-primary" class="btn"></button>
      <button id="sheet-close" class="btn ghost" type="button">Закрыть</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
