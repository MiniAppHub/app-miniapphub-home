<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Настройки · MiniAppHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="back" href="index.html">← Рабочий стол</a>
  <span class="brand">Настройки</span>
  <span></span>
</header>

<main class="view">
  <form id="form" class="form">
    <label>Адрес каталога
      <input name="catalogUrl" type="url" required autocomplete="off">
    </label>
    <label>Тема
      <select name="theme">
        <option value="dark">тёмная</option>
        <option value="light">светлая</option>
      </select>
    </label>
    <button class="btn" type="submit">Сохранить</button>
    <p id="form-msg" class="muted" hidden></p>
  </form>
  <section class="about">
    <p>Оболочка <span id="shell-ver">—</span> · платформа <span id="shell-platform">—</span></p>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script type="module" src="settings.js"></script>
</body>
</html>
