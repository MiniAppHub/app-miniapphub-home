<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Темы · MiniAppHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="back" href="index.html">← Рабочий стол</a>
  <span class="brand">Темы</span>
  <span></span>
</header>

<main class="view">
  <div class="toolbar">
    <label class="grow">Тема
      <select id="pick"></select>
    </label>
    <div class="row-btns">
      <button id="activate" class="btn" type="button">Установить</button>
      <button id="save" class="btn ghost" type="button">Сохранить</button>
      <button id="remove" class="btn ghost danger" type="button">Удалить</button>
    </div>
    <div class="row-btns">
      <input id="newName" class="search" type="text" maxlength="32" placeholder="Название новой темы">
      <button id="create" class="btn ghost" type="button">Создать</button>
    </div>
  </div>
  <p id="hint" class="muted small"></p>
  <div id="fields" class="fields"></div>
</main>

<div id="toast" class="toast" hidden></div>
<script type="module" src="themes.js"></script>
</body>
</html>
